<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>خُطى | رفيقك نحو التفوق</title><link rel="stylesheet" href="login.css">
  <style>
    .links { display: flex; justify-content: center; margin-top: 15px; font-size: 0.9em; }
    .links a { color: #4CAF50; text-decoration: none; }
  </style>

  <link rel="icon" type="image/jpeg" href="logo.jpg">
  <link rel="icon" type="image/jpeg" href="logo.jpg">
</head>
<body>
  <main class="login-shell">
    <section class="login-card">
      <div class="brand"><img src="logo.jpg" alt="Logo" style="height: 60px; border-radius: 8px;"></div>
      <h1>نسيت كلمة المرور</h1>
      <p>أدخل بريدك الإلكتروني المسجل وسنرسل لك رمزاً لإعادة تعيين كلمة المرور.</p>
      
      <form id="forgotForm" autocomplete="off">
        <label>البريد الإلكتروني<input id="email" name="email" type="email" required placeholder="البريد الإلكتروني"></label>
        <button type="submit">إرسال الرمز</button>
        <div id="forgotError" class="error" hidden></div>
      </form>

      <div class="links">
        <a href="/login.html">العودة لتسجيل الدخول</a>
      </div>
    </section>
  </main>
  <script type="module">
    import { auth, sendPasswordResetEmail } from './firebase-init.js';
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const error = document.getElementById('forgotError');
      const btn = form.querySelector('button');
      error.hidden = true; btn.disabled = true; btn.textContent = 'جاري الإرسال...';
      try {
        const email = form.email.value;
        await sendPasswordResetEmail(auth, email);
        error.textContent = 'تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني.';
        error.style.color = 'green';
        error.hidden = false;
      } catch (err) {
        error.textContent = 'فشل الإرسال: ' + err.message; 
        error.style.color = 'red';
        error.hidden = false;
      } finally {
        btn.disabled = false; btn.textContent = 'إرسال الرابط';
      }
    });
  </script>

  <footer style="text-align: center; padding: 20px; font-size: 0.9em; color: #666; margin-top: 40px; border-top: 1px solid #eee;">
    جميع الحقوق محفوظة معاذ الصبوح &copy; <script>document.write(new Date().getFullYear())</script><br>
    <div style="margin-top: 10px; display: flex; justify-content: center; gap: 15px;">
      <a href="https://github.com/MoazAlsabouh/" target="_blank" style="color: #4CAF50; text-decoration: none;">GitHub</a>
      <a href="https://www.linkedin.com/in/moazalsabouh/" target="_blank" style="color: #4CAF50; text-decoration: none;">LinkedIn</a>
      <a href="https://x.com/moazAlsabouh" target="_blank" style="color: #4CAF50; text-decoration: none;">X (Twitter)</a>
    </div>
  </footer>
\n</body>
</html>
