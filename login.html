<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>خُطى | رفيقك نحو التفوق</title>
  <link rel="stylesheet" href="login.css">
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  <style>
    .links { display: flex; justify-content: space-between; margin-top: 15px; font-size: 0.9em; }
    .links a { color: #4285F4; text-decoration: none; font-weight: bold; }
    .brand { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 20px; }
    .brand img { height: 60px; border-radius: 8px; mix-blend-mode: multiply; }
  </style>
</head>
<body>
  <main class="login-shell">
    <section class="login-card">
      <div class="brand">
        <img src="logo.jpg" alt="Logo">
        <span style="font-weight: bold; color: #333; font-size: 1.2em;">خُطى | رفيقك نحو التفوق</span>
      </div>
      <h1 style="text-align:center;">مرحبًا بعودتك</h1>
      <p style="text-align:center; margin-bottom: 20px;">سجّل الدخول للوصول إلى لوحة الدراسة الخاصة بك.</p>
      
      <form id="loginForm" autocomplete="on">
        <label>البريد الإلكتروني<input id="email" name="email" type="email" required placeholder="البريد الإلكتروني"></label>
        <label>كلمة المرور<input id="password" name="password" type="password" required placeholder="كلمة المرور"></label>
        <button type="submit" style="background: #4285F4;">تسجيل الدخول</button>
        <button type="button" id="googleLogin" style="margin-top: 10px; background-color: #fff; color: #3c4043; border: 1px solid #dadce0; border-radius: 4px; padding: 10px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;">
          <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          الدخول بواسطة جوجل
        </button>
        <div id="loginError" class="error" hidden style="margin-top: 10px; color: #d93025; background: #fce8e6; padding: 10px; border-radius: 4px;"></div>
      </form>

      <div class="links">
        <a href="register.html">إنشاء حساب جديد</a>
        <a href="forgot-password.html">نسيت كلمة المرور؟</a>
      </div>
    </section>
  </main>
  <script type="module" src="login.js"></script>
</body>
</html>
