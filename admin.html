  <script type="module">
    import { auth, db, getDocs, collection, addDoc, deleteDoc, doc } from './firebase-init.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    let allLessons = [];

    async function fetchAdminData() {
      try {
        const lessonsSnap = await getDocs(collection(db, 'lessons'));
        const channelsSnap = await getDocs(collection(db, 'channels'));
        const examsSnap = await getDocs(collection(db, 'exams'));
        
        allLessons = [];
        lessonsSnap.forEach(document => {
          allLessons.push({ id: document.id, ...document.data() });
        });

        // Grouping by subjects for stats
        const subjects = [...new Set(allLessons.map(l => l.subject))];

        document.getElementById('statsContainer').innerHTML = `
          <div class="stat-box"><h3>${subjects.length}</h3><p>ظ…ظ‚ط±ط±</p></div>
          <div class="stat-box"><h3>${allLessons.length}</h3><p>ظ…ط­ط§ط¶ط±ط©</p></div>
          <div class="stat-box"><h3>${channelsSnap.size}</h3><p>ظ‚ظ†ط§ط© / ظ…طµط¯ط±</p></div>
          <div class="stat-box"><h3>${examsSnap.size}</h3><p>ط§ظ…طھط­ط§ظ†</p></div>
        `;

          <td>${l.unit || '-'}</td>
          <td>${l.lesson || '-'}</td>

          <td><button class="delete-btn" data-id="${l.id}" style="background: #f44336;">ط­ط°ظپ</button></td>
        </tr>
      `).join('');

      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          if (confirm('ظ‡ظ„ ط£ظ†طھ ظ…طھط£ظƒط¯ ظ…ظ† ط­ط°ظپ ظ‡ط°ظ‡ ط§ظ„ظ…ط­ط§ط¶ط±ط©طں ط³ظٹطھظ… ط­ط°ظپ طھظ‚ط¯ظ…ظƒ ط¨ظ‡ط§ ط£ظٹط¶ط§ظ‹.')) {
            const id = e.target.getAttribute('data-id');
            try {
              await deleteDoc(doc(db, 'lessons', id));
              allLessons = allLessons.filter(l => l.id !== id);
              renderLessonsTable();
              fetchAdminData(); // Refresh stats
            } catch (err) {
              alert("ط®ط·ط£ ظپظٹ ط§ظ„ط­ط°ظپ: " + err.message);

    }

        document.getElementById('addLessonForm').reset();

        renderLessonsTable();

    onAuthStateChanged(auth, user => {
